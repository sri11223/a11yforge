<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harbor Bank — Contact us</title>
  <style>
    :root { --ink:#161616; --muted:#4a4a4a; --brand:#0a5c2e; --line:#d7d7db; }
    * { box-sizing:border-box; }
    body { margin:0; font:16px/1.55 system-ui,Segoe UI,Roboto,sans-serif; color:var(--ink); background:#fff; }
    a { color:var(--brand); }
    .site { display:flex; align-items:center; justify-content:space-between; padding:16px 24px; border-bottom:1px solid var(--line); }
    .brand { font-weight:700; font-size:18px; text-decoration:none; color:var(--ink); }
    nav a { margin-left:20px; text-decoration:none; }
    main { max-width:640px; margin:0 auto; padding:40px 24px; }
    h1 { font-size:28px; margin:0 0 6px; }
    .lede { color:var(--muted); margin:0 0 26px; }
    form { display:grid; gap:16px; }
    .field { display:grid; gap:6px; }
    label { font-weight:600; }
    input, textarea, select { padding:11px 12px; border:1px solid #b3b3ba; border-radius:8px; font-size:16px; font-family:inherit; }
    input:focus-visible, textarea:focus-visible, select:focus-visible { outline:3px solid #ffbf47; outline-offset:1px; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    button { background:var(--brand); color:#fff; border:0; border-radius:8px; padding:12px 18px; font-size:16px; cursor:pointer; }
    footer { border-top:1px solid var(--line); padding:24px; color:var(--muted); margin-top:40px; }
  </style>
</head>
<body>
  <header class="site">
    <a class="brand" href="/">Harbor Bank</a>
    <nav aria-label="Primary">
      <a href="/accounts">Accounts</a>
      <a href="/loans">Loans</a>
      <a href="/support">Support</a>
    </nav>
  </header>

  <main>
    <h1>Contact our team</h1>
    <p class="lede">Questions about your account? Send us a note and we'll reply within one business day.</p>

    <!-- Every field carries a positive tabindex, scrambling the keyboard order to
         first name -> message -> last name -> email -> reason -> submit. -->
    <form>
      <div class="row">
        <div class="field">
          <label for="first">First name</label>
          <input id="first" name="first" type="text" tabindex="1" autocomplete="given-name">
        </div>
        <div class="field">
          <label for="last">Last name</label>
          <input id="last" name="last" type="text" tabindex="3" autocomplete="family-name">
        </div>
      </div>

      <div class="field">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" tabindex="4" autocomplete="email">
      </div>

      <div class="field">
        <label for="reason">Reason for contact</label>
        <select id="reason" name="reason" tabindex="5">
          <option>General question</option>
          <option>Report a problem</option>
          <option>Close my account</option>
        </select>
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" tabindex="2"></textarea>
      </div>

      <button type="submit" tabindex="6">Send message</button>
    </form>
  </main>

  <footer>
    <p>&copy; Harbor Bank. Member FDIC. <a href="/privacy">Privacy</a></p>
  </footer>
</body>
</html>
