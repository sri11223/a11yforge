<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlas Studio — Work</title>
  <style>
    :root { --ink:#141414; --muted:#4a4a4a; --brand:#8a1c3b; --line:#e4e0dc; }
    * { box-sizing:border-box; }
    body { margin:0; font:16px/1.55 system-ui,Segoe UI,Roboto,sans-serif; color:var(--ink); background:#fff; }
    a { color:var(--brand); }
    .site { display:flex; align-items:center; justify-content:space-between; padding:16px 24px; border-bottom:1px solid var(--line); }
    .brand { font-weight:700; font-size:18px; text-decoration:none; color:var(--ink); }
    nav a { margin-left:20px; text-decoration:none; }
    main { max-width:1000px; margin:0 auto; padding:40px 24px; }
    h1 { font-size:30px; margin:0 0 8px; }
    .lede { color:var(--muted); margin:0 0 28px; }
    .hero { width:100%; aspect-ratio:16/7; object-fit:cover; border-radius:14px; background:#efe9e4; display:block; }
    .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-top:28px; }
    @media (max-width:760px){ .grid{ grid-template-columns:1fr 1fr; } }
    figure { margin:0; }
    figure img { width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:10px; background:#efe9e4; }
    figcaption { color:var(--muted); font-size:14px; margin-top:8px; }
    footer { border-top:1px solid var(--line); padding:24px; color:var(--muted); margin-top:40px; }
  </style>
</head>
<body>
  <header class="site">
    <a class="brand" href="/">Atlas Studio</a>
    <nav aria-label="Primary">
      <a href="/work">Work</a>
      <a href="/studio">Studio</a>
      <a href="/contact">Contact</a>
    </nav>
  </header>

  <main>
    <h1>Selected work</h1>
    <p class="lede">Brand systems and campaigns for people who make things.</p>

    <!-- Alt text is present (axe passes) but conveys nothing. -->
    <img class="hero" src="assets/hero.jpg" alt="image">

    <section class="grid" aria-label="Projects">
      <figure>
        <img src="assets/harvest.jpg" alt="photo">
        <figcaption>Harvest Table — identity</figcaption>
      </figure>
      <figure>
        <img src="assets/lumen.jpg" alt="image">
        <figcaption>Lumen — packaging</figcaption>
      </figure>
      <figure>
        <img src="assets/verge.jpg" alt="picture">
        <figcaption>Verge — campaign</figcaption>
      </figure>
    </section>
  </main>

  <footer>
    <p>&copy; Atlas Studio. <a href="/instagram">Instagram</a></p>
  </footer>
</body>
</html>
