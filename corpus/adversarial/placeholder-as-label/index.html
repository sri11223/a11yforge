<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wander — Book a stay</title>
  <style>
    :root { --ink:#141414; --muted:#4a4a4a; --brand:#0a6b5b; --line:#dbe6e2; }
    * { box-sizing:border-box; }
    body { margin:0; font:16px/1.55 system-ui,Segoe UI,Roboto,sans-serif; color:var(--ink); background:#fff; }
    a { color:var(--brand); }
    .site { display:flex; align-items:center; justify-content:space-between; padding:16px 24px; border-bottom:1px solid var(--line); }
    .brand { font-weight:700; font-size:18px; text-decoration:none; color:var(--ink); }
    nav a { margin-left:20px; text-decoration:none; }
    main { max-width:560px; margin:0 auto; padding:40px 24px; }
    h1 { font-size:26px; margin:0 0 6px; }
    .lede { color:var(--muted); margin:0 0 24px; }
    form { display:grid; gap:14px; }
    input { padding:12px 12px; border:1px solid #b3b3ba; border-radius:8px; font-size:16px; }
    input:focus-visible { outline:3px solid #ffbf47; outline-offset:1px; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    button { background:var(--brand); color:#fff; border:0; border-radius:8px; padding:12px 18px; font-size:16px; cursor:pointer; }
    footer { border-top:1px solid var(--line); padding:24px; color:var(--muted); margin-top:40px; }
  </style>
</head>
<body>
  <header class="site">
    <a class="brand" href="/">Wander</a>
    <nav aria-label="Primary">
      <a href="/stays">Stays</a>
      <a href="/experiences">Experiences</a>
      <a href="/trips">Trips</a>
    </nav>
  </header>

  <main>
    <h1>Book your stay</h1>
    <p class="lede">Tell us a few details and we'll hold your dates.</p>

    <!-- BUG: every field relies on a placeholder as its only label. The placeholder
         vanishes on input and is not a reliable accessible name. No <label> present. -->
    <form>
      <input type="text" placeholder="Full name" autocomplete="name">
      <input type="email" placeholder="Email address" autocomplete="email">
      <div class="row">
        <input type="text" placeholder="Check-in (MM/DD/YYYY)">
        <input type="text" placeholder="Check-out (MM/DD/YYYY)">
      </div>
      <input type="number" placeholder="Guests" min="1" max="12">
      <button type="submit">Request booking</button>
    </form>
  </main>

  <footer>
    <p>&copy; Wander Travel. <a href="/help">Help</a></p>
  </footer>
</body>
</html>
