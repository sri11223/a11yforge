<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loop — Your library</title>
  <style>
    :root { --ink:#141414; --muted:#4a4a4a; --brand:#b23a00; --line:#e6e2dc; }
    * { box-sizing:border-box; }
    body { margin:0; font:16px/1.55 system-ui,Segoe UI,Roboto,sans-serif; color:var(--ink); background:#fff; }
    a { color:var(--brand); }
    .site { display:flex; align-items:center; justify-content:space-between; padding:16px 24px; border-bottom:1px solid var(--line); }
    .brand { font-weight:700; font-size:18px; text-decoration:none; color:var(--ink); }
    nav a { margin-left:20px; text-decoration:none; }
    main { max-width:820px; margin:0 auto; padding:40px 24px; }
    h1 { font-size:28px; margin:0 0 20px; }
    .track { display:flex; align-items:center; gap:14px; padding:12px; border:1px solid var(--line); border-radius:12px; margin-bottom:12px; }
    .cover { width:52px; height:52px; border-radius:8px; background:#efe9e2; flex:none; }
    .meta { flex:1; }
    .meta .t { font-weight:600; }
    .meta .a { color:var(--muted); font-size:14px; }
    /* Styled to look and behave like a button, but it is a role=button with no
       tabindex, so keyboard users can never reach it. */
    .icon-btn { width:40px; height:40px; border-radius:50%; display:grid; place-items:center; background:#f4efe9; color:var(--brand); font-size:18px; cursor:pointer; user-select:none; }
    .icon-btn:hover { background:#eee6dd; }
    footer { border-top:1px solid var(--line); padding:24px; color:var(--muted); margin-top:40px; }
  </style>
</head>
<body>
  <header class="site">
    <a class="brand" href="/">Loop</a>
    <nav aria-label="Primary">
      <a href="/browse">Browse</a>
      <a href="/library">Library</a>
      <a href="/account">Account</a>
    </nav>
  </header>

  <main>
    <h1>Your library</h1>

    <div class="track">
      <div class="cover" aria-hidden="true"></div>
      <div class="meta">
        <div class="t">Ceremony</div>
        <div class="a">The Silver Lines</div>
      </div>
      <!-- Has an accessible name (axe passes) but no tabindex: not keyboard-reachable. -->
      <div class="icon-btn" role="button" aria-label="Play Ceremony by The Silver Lines" onclick="play(this)">&#9654;</div>
    </div>

    <div class="track">
      <div class="cover" aria-hidden="true"></div>
      <div class="meta">
        <div class="t">Northbound</div>
        <div class="a">Iris Vale</div>
      </div>
      <div class="icon-btn" role="button" aria-label="Play Northbound by Iris Vale" onclick="play(this)">&#9654;</div>
    </div>
  </main>

  <footer>
    <p>&copy; Loop Audio. <a href="/terms">Terms</a></p>
  </footer>

  <script>
    function play(el) { el.textContent = '❚❚'; }
  </script>
</body>
</html>
