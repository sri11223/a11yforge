<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support — Contact</title><style>:root{--ink:#161616;--muted:#454545;--brand:#0b4a8f;--line:#dcdce0}*{box-sizing:border-box}body{margin:0;font:16px/1.55 system-ui,Segoe UI,Roboto,sans-serif;color:var(--ink);background:#fff}a{color:var(--brand)}.site{display:flex;justify-content:space-between;padding:14px 22px;border-bottom:1px solid var(--line)}.brand{font-weight:700;text-decoration:none;color:var(--ink)}nav a{margin-left:18px;text-decoration:none}main{max-width:820px;margin:0 auto;padding:32px 22px}h1{font-size:28px;margin:0 0 12px}label{display:block;font-weight:600;margin:12px 0 6px}input,select,textarea{width:100%;padding:10px;border:1px solid #b3b3ba;border-radius:8px;font-size:16px}button{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:11px 16px;font-size:16px;cursor:pointer}.btn:focus-visible,a:focus-visible,button:focus-visible{outline:3px solid #ffbf47;outline-offset:2px}figure{margin:20px 0}figure img{width:100%;max-width:420px;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:#eee}figcaption{color:var(--muted);font-size:14px;margin-top:6px}</style></head>
