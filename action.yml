name: "A11yForge gap check"
description: "Fail the build when a scanner-clean page is still unusable to a screen-reader or keyboard user."
branding:
  icon: "eye"
  color: "blue"

inputs:
  target:
    description: "File path, directory, or URL to audit (passed to `a11yforge audit`)."
    required: true
  ci:
    description: "Strict mode: fail on ANY issue (Layer A, B, or C), not only the scanner-hidden ones. Default false = fail only on the scanner-clean-but-broken gap (Layer B/C)."
    required: false
    default: "false"
  no-llm:
    description: "Disable the Layer C LLM judge and use the deterministic backstops only. Default true, so the check needs no API key."
    required: false
    default: "true"
  html-report:
    description: "Optional path to write a standalone HTML gap report (upload it as an artifact)."
    required: false
    default: ""
  comment:
    description: "On pull_request events, post the gap report as a PR comment (requires github-token). Default false."
    required: false
    default: "false"
  github-token:
    description: "Token used to post the PR comment when `comment` is true. Usually the workflow's own `github.token`."
    required: false
    default: ""

outputs:
  exit-code:
    # Exposed so a caller can assert on what the audit ACTUALLY returned rather than on
    # step outcome. `outcome` is 'failure' for any reason at all — including this action
    # failing to load or build — so asserting on it lets an infrastructure error pass as
    # "the gate caught the bug". 0 = nothing a scanner misses · 1 = gaps found ·
    # 2 = usage/fetch error.
    description: "The audit's exit code (0 clean, 1 gaps found, 2 usage/fetch error)."
    value: ${{ steps.audit.outputs.exit-code }}

runs:
  using: "composite"
  steps:
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Build A11yForge (from the action's own checkout)
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH"
        npm ci
        npm run build
        npx --yes playwright install --with-deps chromium

    - name: Run the A11yForge gap audit
      id: audit
      shell: bash
      env:
        A11YFORGE_PA11Y_CHROMIUM: "1"
        # Inputs go through env, NEVER inline ${{ }}: expression substitution happens before bash
        # parses the script, so a target sourced from an issue body or PR title would otherwise run
        # as shell with the job's token. Quoted "$VAR" expansion cannot inject.
        TARGET: ${{ inputs.target }}
        CI_FLAG: ${{ inputs.ci }}
        NO_LLM: ${{ inputs.no-llm }}
        HTML_REPORT: ${{ inputs.html-report }}
      run: |
        cd "$GITHUB_WORKSPACE"
        flags=()
        [ "$CI_FLAG" = "true" ] && flags+=(--ci)
        [ "$NO_LLM" = "true" ] && flags+=(--no-llm)
        [ -n "$HTML_REPORT" ] && flags+=(--html "$HTML_REPORT")
        set +e
        node "$GITHUB_ACTION_PATH/dist/src/cli/audit.js" audit "$TARGET" "${flags[@]}" | tee "$RUNNER_TEMP/a11yforge.out"
        code=${PIPESTATUS[0]}
        set -e
        {
          echo "## A11yForge gap check — \`$TARGET\`"
          echo ""
          if [ "$code" = "0" ]; then echo "✅ No scanner-clean-but-broken issues found."; \
          elif [ "$code" = "1" ]; then echo "⚠️ **Scanner-clean ≠ usable** — issues a scanner cannot see were found. This check blocks the false-green."; \
          else echo "❌ audit could not run (usage/fetch error)."; fi
          echo ""
          echo '```'
          cat "$RUNNER_TEMP/a11yforge.out"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        exit $code

    - name: Post PR comment
      if: ${{ always() && inputs.comment == 'true' && github.event_name == 'pull_request' && inputs.github-token != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TARGET: ${{ inputs.target }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        EXIT_CODE: ${{ steps.audit.outputs.exit-code }}
      run: |
        body="$RUNNER_TEMP/a11yforge-comment.md"
        {
          echo "### A11yForge gap check — \`$TARGET\`"
          echo ""
          echo '```'
          cat "$RUNNER_TEMP/a11yforge.out"
          echo '```'
          echo ""
          echo "_Exit $EXIT_CODE · scanner-clean ≠ usable is the whole point._"
        } > "$body"
        gh pr comment "$PR_NUMBER" --body-file "$body" || \
          echo "::warning::could not post PR comment (check token permissions: pull-requests: write)"
