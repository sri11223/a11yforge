name: A11yForge gap check

# Demonstrates the A11yForge Action on this repo's own pages:
#   - a genuinely accessible page PASSES (green)
#   - a scanner-clean-but-broken page is CAUGHT and would block a merge (shown green here
#     by asserting the check failed, so this demo run stays meaningful)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  clean-page-passes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit an accessible page (expect pass)
        uses: ./
        with:
          target: examples/accessible-page.html

  broken-page-blocks-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit a scanner-clean-but-broken page (expect the check to fail)
        id: gap
        continue-on-error: true
        uses: ./
        with:
          target: corpus/adversarial/keyboard-trap-modal/index.html
          html-report: gap-report.html
      - name: Upload the HTML gap report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11yforge-gap-report
          path: gap-report.html
          if-no-files-found: ignore
      - name: Assert the gap was caught (this is the merge-blocking behavior)
        shell: bash
        run: |
          # Assert on the audit's OWN exit code, never on step outcome.
          # `outcome` is 'failure' for any reason at all — including the action failing to
          # load or build — so asserting on it would let an infrastructure error masquerade
          # as "the gate caught the bug". That is precisely the false green this project
          # exists to condemn, so the demo must not be able to produce one.
          code="${{ steps.gap.outputs.exit-code }}"
          echo "audit exit code: '${code:-<empty>}'"
          if [ "$code" = "1" ]; then
            echo "✅ A11yForge exited 1 on a scanner-clean-but-broken page — a real PR would be blocked here."
          elif [ -z "$code" ]; then
            echo "::error::The audit never ran — no exit code was reported. The action failed to load or build, so nothing was verified."
            exit 1
          else
            echo "::error::Expected exit 1 on the keyboard-trap page (scanner-clean but unusable); got exit $code."
            exit 1
          fi
